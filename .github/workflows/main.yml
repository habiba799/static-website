
name: Portfolio Deployment

on:
  push:
    branches:
      - main

# Allow GitHub to request an OIDC token from AWS.
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Deploy Website to Private S3
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Authenticate to AWS using GitHub OIDC.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # 3. Verify which AWS identity is being used.
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # 4. Upload website files to private S3.
      - name: Deploy Static Website to S3
        run: |
          aws s3 sync ./S3-Static-Website-master \
            s3://private-cloudfront-lab/static-web/ \
            --delete

      # 5. Refresh CloudFront cache.
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E386NZB64O48JS \
            --paths "/*"
